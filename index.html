<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page">
        <section class="form-card" aria-labelledby="login-title">
            <div class="page-header">
                <p class="kicker">User Management System</p>
                <h1 id="login-title">Sign in</h1>
                <p class="subtext">Use your registered account to continue.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <div class="error" id="emailError"></div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <div class="error" id="passwordError"></div>
                </div>

                <div class="message" id="formMessage"></div>

                <div class="button-row">
                    <button class="full-width" type="submit">Login</button>
                </div>
            </form>

            <p class="secondary-link">Need an account? <a href="register.html">Register</a></p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
